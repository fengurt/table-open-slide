<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; color: #2C3E50; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            position: relative;
            padding: 80px 100px 0 100px;
            display: flex;
            flex-direction: column;
        }
        .chapter-anchor {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 20px;
            color: #A88B52;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .chapter-anchor span {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-left: 15px;
        }
        .main-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 36px;
            color: #0A1626;
            margin-bottom: 50px;
        }
        .actions-container {
            display: flex;
            gap: 80px;
            flex: 1;
        }
        .actions-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .action-item {
            display: flex;
            align-items: flex-start;
            border-top: 1px solid rgba(168, 139, 82, 0.3);
            padding-top: 15px;
        }
        .action-num {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 32px;
            color: #A88B52;
            margin-right: 20px;
            line-height: 1;
            width: 30px;
        }
        .action-content {
            flex: 1;
        }
        .action-title {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 18px;
            color: #0A1626;
            margin-bottom: 8px;
        }
        .action-desc {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 14px;
            color: #2C3E50;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="chapter-anchor">10 <span>Immediate Actions</span></div>
        <h1 class="main-title">未来十二个月，董事会层面必须完成的七件事</h1>
        
        <div class="actions-container">
            <div class="actions-col">
                <div class="action-item">
                    <div class="action-num">1</div>
                    <div class="action-content">
                        <div class="action-title">重设考核周期</div>
                        <div class="action-desc">将人工智能项目考核延长至 18–24 个月，分阶段切换 KPI。</div>
                    </div>
                </div>
                <div class="action-item">
                    <div class="action-num">2</div>
                    <div class="action-content">
                        <div class="action-title">绑定高管 OKR</div>
                        <div class="action-desc">将系统采用率纳入高层管理者年度目标与关键结果。</div>
                    </div>
                </div>
                <div class="action-item">
                    <div class="action-num">3</div>
                    <div class="action-content">
                        <div class="action-title">强制流程重构</div>
                        <div class="action-desc">禁止"旧流程 + 新工具"的伪转型，建立流程再造审查委员会。</div>
                    </div>
                </div>
                <div class="action-item">
                    <div class="action-num">4</div>
                    <div class="action-content">
                        <div class="action-title">启动异常拦截</div>
                        <div class="action-desc">在内部高频低风险任务全面替换串联审批模式。</div>
                    </div>
                </div>
            </div>
            
            <div class="actions-col">
                <div class="action-item">
                    <div class="action-num">5</div>
                    <div class="action-content">
                        <div class="action-title">建立 CoE</div>
                        <div class="action-desc">组建跨部门人工智能卓越中心，统筹治理、采购与人才发展。</div>
                    </div>
                </div>
                <div class="action-item">
                    <div class="action-num">6</div>
                    <div class="action-content">
                        <div class="action-title">架构网关层</div>
                        <div class="action-desc">在应用与底层模型之间构建抽象网关，规避供应商锁定。</div>
                    </div>
                </div>
                <div class="action-item">
                    <div class="action-num">7</div>
                    <div class="action-content">
                        <div class="action-title">重投节省工时</div>
                        <div class="action-desc">将研发与营销节省的工时强制重新投入创新与人才升级。</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
