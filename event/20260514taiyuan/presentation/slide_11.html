<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background: #FFFFFF; 
            position: relative;
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        .header {
            position: absolute;
            top: 80px;
            left: 120px;
            width: 1040px;
        }
        .chapter-label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #A88B52;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .main-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 48px;
            color: #0A1626;
            margin-bottom: 16px;
        }
        .subtitle {
            font-size: 20px;
            color: #6B7280;
        }
        .content-area {
            position: absolute;
            top: 280px;
            left: 120px;
            width: 1040px;
            display: flex;
            gap: 60px;
        }
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .inst-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 32px;
            color: #A88B52;
            margin-bottom: 16px;
            line-height: 1.2;
        }
        .separator {
            width: 100%;
            height: 1px;
            background-color: #A88B52;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .inst-label {
            font-family: 'Noto Serif SC', serif;
            font-size: 18px;
            color: #6B7280;
            font-style: italic;
            margin-bottom: 24px;
        }
        .inst-desc {
            font-size: 18px;
            color: #0A1626;
            line-height: 1.8;
        }
        .inst-desc strong {
            font-weight: 700;
        }
        .conclusion {
            position: absolute;
            bottom: 80px;
            left: 120px;
            width: 1040px;
            border-top: 1px solid #A88B52;
            padding-top: 24px;
            font-size: 16px;
            color: #0A1626;
            text-align: center;
        }
        .footer {
            position: absolute;
            right: 40px;
            bottom: 30px;
            font-size: 10px;
            color: #A88B52;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="chapter-label">THREE LENSES · 三重坐标</div>
            <div class="main-title">只看这三家，足够</div>
            <div class="subtitle">三家视角不同，交叉看才能找到真正确定的事</div>
        </div>
        
        <div class="content-area">
            <div class="column">
                <div class="inst-name">麦肯锡<br>McKinsey</div>
                <div class="separator"></div>
                <div class="inst-label">策略咨询</div>
                <div class="inst-desc">钱和判断<strong>绑定</strong>——<br>说错了自己要赔。</div>
            </div>
            <div class="column">
                <div class="inst-name">红杉资本<br>Sequoia</div>
                <div class="separator"></div>
                <div class="inst-label">一级市场头部</div>
                <div class="inst-desc">看的是未来 <strong>5–10 年</strong>的钱往哪里走。</div>
            </div>
            <div class="column">
                <div class="inst-name">OpenAI<br>&nbsp;</div>
                <div class="separator"></div>
                <div class="inst-label">AI 前沿</div>
                <div class="inst-desc">最接近 AI 前沿的公司，内部数据反映<strong>真实使用情况</strong>。</div>
            </div>
        </div>
        
        <div class="conclusion">
            "三家视角不同，交叉看才能找到真正确定的事。"
        </div>
        
        <div class="footer">少数人的视野 — 岁知社闭门分享 · 郭峰 · 2026.05.14</div>
    </div>
</body>
</html>
