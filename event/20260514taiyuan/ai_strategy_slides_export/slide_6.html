<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            position: relative;
            font-family: 'Noto Sans SC', sans-serif;
            color: #1A2B4C;
            overflow: hidden;
        }
        .header {
            position: absolute;
            top: 80px;
            left: 120px;
            display: flex;
            align-items: center;
        }
        .header-line {
            width: 40px;
            height: 1px;
            background: #A88B52;
            margin-right: 20px;
        }
        .header-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 32px;
            color: #0A1626;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .content-wrapper {
            position: absolute;
            top: 220px;
            left: 120px;
            width: 1040px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 60px;
        }
        .column {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .col-number {
            font-family: 'Noto Serif SC', serif;
            font-size: 48px;
            color: #A88B52;
            line-height: 1;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .col-title {
            font-size: 24px;
            color: #0A1626;
            font-weight: 400;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(168, 139, 82, 0.3);
        }
        .col-text {
            font-size: 18px;
            color: #1A2B4C;
            line-height: 1.8;
            font-weight: 300;
            margin-bottom: 16px;
        }
        .col-highlight {
            font-size: 16px;
            color: rgba(26, 43, 76, 0.7);
            line-height: 1.6;
            font-weight: 300;
            padding-left: 16px;
            border-left: 2px solid #A88B52;
        }
        .footer {
            position: absolute;
            bottom: 60px;
            left: 120px;
            font-size: 16px;
            color: #A88B52;
            letter-spacing: 2px;
            font-weight: 300;
        }
        .accent-circle {
            position: absolute;
            top: -150px;
            right: -150px;
            width: 400px;
            height: 400px;
            border: 1px solid rgba(168, 139, 82, 0.15);
            border-radius: 50%;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-circle"></div>
        
        <div class="header">
            <div class="header-line"></div>
            <div class="header-title">用三个问题，把 90% 的 AI 噪音过滤掉</div>
        </div>
        
        <div class="content-wrapper">
            <div class="column">
                <div class="col-number">01</div>
                <div class="col-title">利益绑定</div>
                <div class="col-text">说这话的人，钱和判断有没有绑定？</div>
                <div class="col-highlight">麦肯锡 vs 自媒体博主<br>— 立场决定结论</div>
            </div>
            
            <div class="column">
                <div class="col-number">02</div>
                <div class="col-title">反例检验</div>
                <div class="col-text">这个结论有没有可以反驳的案例？</div>
                <div class="col-highlight">只说成功案例的要警惕<br>— 单边叙事即营销</div>
            </div>
            
            <div class="column">
                <div class="col-number">03</div>
                <div class="col-title">时间维度</div>
                <div class="col-text">1–3 年可落地，还是 5–10 年的远景？</div>
                <div class="col-highlight">混淆时间维度<br>是最常见的信息陷阱</div>
            </div>
        </div>
        
        <div class="footer">判断力 = 立场 × 反例 × 时间窗</div>
    </div>
</body>
</html>
