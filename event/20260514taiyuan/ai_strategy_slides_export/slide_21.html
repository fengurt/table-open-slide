<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            position: relative;
            font-family: 'Noto Sans SC', sans-serif;
            color: #1A2B4C;
            overflow: hidden;
        }
        .header {
            position: absolute;
            top: 70px;
            left: 120px;
            width: 1040px;
        }
        .header-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 40px;
            color: #0A1626;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .header-line {
            width: 60px;
            height: 2px;
            background: #A88B52;
        }
        .content-wrapper {
            position: absolute;
            top: 150px;
            left: 120px;
            width: 1040px;
        }
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .matrix-table th {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px;
            color: #0A1626;
            font-weight: 700;
            padding: 12px 10px;
            border-top: 2px solid #0A1626;
            border-bottom: 1px solid #A88B52;
        }
        .matrix-table td {
            font-size: 18px;
            color: #1A2B4C;
            font-weight: 300;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(10, 22, 38, 0.1);
        }
        .matrix-table tr:last-child td {
            border-bottom: 2px solid #A88B52;
        }
        .col-type { width: 40%; font-weight: 500 !important; color: #0A1626 !important; }
        .col-speed { width: 20%; }
        .col-diff { width: 20%; }
        .col-prio { width: 20%; color: #A88B52 !important; letter-spacing: 2px; }
        
        .footer {
            position: absolute;
            bottom: 40px;
            left: 120px;
            width: 1040px;
            text-align: center;
            font-size: 20px;
            color: #A88B52;
            letter-spacing: 2px;
            font-weight: 500;
        }
        .accent-bg {
            position: absolute;
            top: 0;
            right: 0;
            width: 300px;
            height: 100%;
            background: linear-gradient(to left, rgba(168, 139, 82, 0.03), transparent);
            z-index: 0;
        }
        .header, .content-wrapper, .footer {
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-bg"></div>
        
        <div class="header">
            <div class="header-title">一张矩阵，决定你的 AI 投资优先级</div>
            <div class="header-line"></div>
        </div>
        
        <div class="content-wrapper">
            <table class="matrix-table">
                <thead>
                    <tr>
                        <th class="col-type">场景类型</th>
                        <th class="col-speed">回报速度</th>
                        <th class="col-diff">实施难度</th>
                        <th class="col-prio">推荐优先级</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="col-type">重复性文档处理（报告 / 合同 / 报价）</td>
                        <td class="col-speed">快（1–3 月）</td>
                        <td class="col-diff">低</td>
                        <td class="col-prio">★★★★★</td>
                    </tr>
                    <tr>
                        <td class="col-type">客服 / 销售支持</td>
                        <td class="col-speed">快（1–6 月）</td>
                        <td class="col-diff">低–中</td>
                        <td class="col-prio">★★★★</td>
                    </tr>
                    <tr>
                        <td class="col-type">质量检测 / 安全巡检</td>
                        <td class="col-speed">中（3–12 月）</td>
                        <td class="col-diff">中</td>
                        <td class="col-prio">★★★★</td>
                    </tr>
                    <tr>
                        <td class="col-type">设备预测性维护</td>
                        <td class="col-speed">中（6–18 月）</td>
                        <td class="col-diff">中–高</td>
                        <td class="col-prio">★★★</td>
                    </tr>
                    <tr>
                        <td class="col-type">供应链优化 / 智能决策</td>
                        <td class="col-speed">慢（12–36 月）</td>
                        <td class="col-diff">高</td>
                        <td class="col-prio">★★</td>
                    </tr>
                    <tr>
                        <td class="col-type">全流程 AI 重构</td>
                        <td class="col-speed">慢（24–36 月+）</td>
                        <td class="col-diff">极高</td>
                        <td class="col-prio">★（谨慎）</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="footer">先做★★★★★，再赚下一格的钱</div>
    </div>
</body>
</html>
