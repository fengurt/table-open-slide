<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            position: relative;
            font-family: 'Noto Sans SC', sans-serif;
            color: #1A2B4C;
            overflow: hidden;
        }
        .header {
            position: absolute;
            top: 80px;
            left: 120px;
            width: 1040px;
        }
        .header-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 40px;
            color: #0A1626;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .header-line {
            width: 60px;
            height: 2px;
            background: #A88B52;
        }
        .content-wrapper {
            position: absolute;
            top: 200px;
            left: 120px;
            width: 1040px;
            display: flex;
            justify-content: space-between;
        }
        .column {
            width: 480px;
            padding-top: 20px;
            border-top: 1px solid rgba(10, 22, 38, 0.2);
        }
        .col-right {
            border-top: 1px solid #A88B52;
        }
        .col-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .col-left .col-title {
            color: #0A1626;
        }
        .col-right .col-title {
            color: #A88B52;
        }
        .col-text {
            font-size: 20px;
            line-height: 1.8;
            font-weight: 300;
        }
        .col-left .col-text {
            color: rgba(26, 43, 76, 0.8);
        }
        .col-right .col-text {
            color: #0A1626;
            font-weight: 500;
        }
        .arrow-step {
            display: inline-block;
            color: #A88B52;
            margin: 0 10px;
        }
        .bottom-box {
            position: absolute;
            top: 420px;
            left: 120px;
            width: 1040px;
            border: 1px solid #A88B52;
            padding: 40px;
            background: rgba(168, 139, 82, 0.02);
        }
        .box-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px;
            color: #A88B52;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .box-content {
            display: flex;
            justify-content: space-between;
        }
        .box-item {
            width: 30%;
            font-size: 18px;
            line-height: 1.6;
            color: #0A1626;
            font-weight: 400;
            border-left: 2px solid rgba(168, 139, 82, 0.3);
            padding-left: 20px;
        }
        .box-item-highlight {
            color: #A88B52;
            font-weight: 500;
            margin-top: 10px;
            font-size: 16px;
        }
        .accent-circle {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            border: 1px solid rgba(168, 139, 82, 0.15);
            border-radius: 50%;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-circle"></div>
        
        <div class="header">
            <div class="header-title">不做大转型，只做最小成本验证</div>
            <div class="header-line"></div>
        </div>
        
        <div class="content-wrapper">
            <div class="column col-left">
                <div class="col-title">不建议</div>
                <div class="col-text">大规模 AI 转型项目<br>（高投入、高风险、慢回报）</div>
            </div>
            
            <div class="column col-right">
                <div class="col-title">推荐姿势</div>
                <div class="col-text">
                    找一个最痛的点<br>
                    <span class="arrow-step">↓</span><br>
                    最小代价验证<br>
                    <span class="arrow-step">↓</span><br>
                    跑通了复制
                </div>
            </div>
        </div>
        
        <div class="bottom-box">
            <div class="box-title">参考成本</div>
            <div class="box-content">
                <div class="box-item">
                    1 个内部负责人的<br>3 个月时间
                </div>
                <div class="box-item">
                    AI 工具订阅费：<br>500 – 5 000 元 / 月
                </div>
                <div class="box-item">
                    如果这个投入没有任何回报<br>
                    <div class="box-item-highlight">→ 方向错了，及时调整</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
