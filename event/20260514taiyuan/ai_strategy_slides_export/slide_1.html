<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            position: relative;
            font-family: 'Noto Sans SC', sans-serif;
            color: #1A2B4C;
            overflow: hidden;
        }
        .content-wrapper {
            position: absolute;
            top: 25%;
            left: 120px;
            width: 700px;
            z-index: 2;
        }
        .eyebrow {
            color: #A88B52;
            font-size: 20px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 400;
        }
        .main-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 72px;
            color: #0A1626;
            line-height: 1.2;
            margin-bottom: 40px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 28px;
            color: #1A2B4C;
            line-height: 1.5;
            font-weight: 300;
        }
        .meta-wrapper {
            position: absolute;
            bottom: 80px;
            left: 120px;
        }
        .meta-line {
            width: 60px;
            height: 1px;
            background: #A88B52;
            margin-bottom: 20px;
        }
        .meta-text {
            color: #A88B52;
            font-size: 18px;
            letter-spacing: 2px;
        }
        .accent-line-vertical {
            position: absolute;
            top: 0;
            right: 320px;
            width: 1px;
            height: 100%;
            background: rgba(168, 139, 82, 0.3);
            z-index: 1;
        }
        .accent-circle {
            position: absolute;
            top: -100px;
            right: 150px;
            width: 400px;
            height: 400px;
            border: 1px solid rgba(168, 139, 82, 0.15);
            border-radius: 50%;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-line-vertical"></div>
        <div class="accent-circle"></div>
        
        <div class="content-wrapper">
            <div class="eyebrow">AI · STRATEGY · TAIYUAN</div>
            <div class="main-title">老板的 AI 决策框架</div>
            <div class="subtitle">信息差、组织重构与最小成本试错<br>— 写给太原企业主</div>
        </div>
        
        <div class="meta-wrapper">
            <div class="meta-line"></div>
            <div class="meta-text">2025 · 闭门分享</div>
        </div>
    </div>
</body>
</html>
