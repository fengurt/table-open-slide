<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Inter:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background: #FFFFFF; 
            position: relative;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1A2639;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .eyebrow {
            position: absolute;
            top: 80px;
            left: 100px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #A88B52;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .main-quote {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 36px;
            color: #0A1626;
            font-weight: 600;
            line-height: 1.6;
            max-width: 900px;
            margin-bottom: 40px;
        }
        .separator {
            width: 80px;
            height: 1px;
            background-color: #A88B52;
            margin-bottom: 40px;
        }
        .sub-quote {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 28px;
            color: #A88B52;
            font-style: italic;
            letter-spacing: 2px;
        }
        .footer {
            position: absolute;
            bottom: 60px;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            font-size: 14px;
            color: #0A1626;
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="eyebrow">SLIDE 50 · CLOSING</div>
        
        <div class="main-quote">
            「太原老板不缺努力，不缺资金，<br>
            缺的是一个既懂全球趋势、又站在你这个城市和行业里的人，<br>
            帮你把复杂信息翻译成可以落地的判断。」
        </div>
        
        <div class="separator"></div>
        
        <div class="sub-quote">
            「今天是开始，不是终点。」
        </div>
        
        <div class="footer">
            岁知社 · TABLE AI · OPC Global · 郭峰
        </div>
    </div>
</body>
</html>
