<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Inter:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background: #FFFFFF; 
            position: relative;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1A2639;
        }
        .content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
        }
        .header {
            margin-bottom: 50px;
        }
        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #A88B52;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .headline {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 40px;
            color: #0A1626;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .sub-lede {
            font-size: 18px;
            color: #1A2639;
            opacity: 0.8;
        }
        .main-content {
            display: flex;
            flex: 1;
            gap: 80px;
        }
        .left-column {
            flex: 3;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #A88B52;
            padding-left: 30px;
            justify-content: space-between;
            padding-top: 10px;
            padding-bottom: 10px;
        }
        .track-item {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 22px;
            color: #0A1626;
            font-weight: 600;
            position: relative;
        }
        .track-item::before {
            content: '';
            position: absolute;
            left: -34px;
            top: 50%;
            transform: translateY(-50%);
            width: 7px;
            height: 7px;
            background-color: #A88B52;
            border-radius: 50%;
        }
        .right-column {
            flex: 7;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .method-item {
            display: flex;
            align-items: flex-start;
            border-top: 1px solid rgba(10, 22, 38, 0.1);
            padding-top: 24px;
        }
        .method-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #A88B52;
            font-weight: 600;
            margin-right: 24px;
            line-height: 1;
            min-width: 40px;
        }
        .method-content {
            flex: 1;
        }
        .method-title {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            font-size: 20px;
            color: #0A1626;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .method-desc {
            font-size: 16px;
            color: #1A2639;
            line-height: 1.6;
            opacity: 0.9;
        }
        .footer-quote {
            margin-top: 50px;
            text-align: center;
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 22px;
            color: #A88B52;
            font-style: italic;
            letter-spacing: 2px;
            padding-top: 30px;
            border-top: 2px solid #0A1626;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <div class="header">
                <div class="eyebrow">SLIDE 43 · SECOND CURVE × AI</div>
                <h2 class="headline">第二曲线的竞争，已经换了赛道</h2>
                <div class="sub-lede">太原「十五五」新赛道，政府已经明确方向。</div>
            </div>
            
            <div class="main-content">
                <div class="left-column">
                    <div class="track-item">新材料</div>
                    <div class="track-item">生物医药</div>
                    <div class="track-item">高端装备制造</div>
                    <div class="track-item">低空经济</div>
                    <div class="track-item">商业航天</div>
                </div>
                
                <div class="right-column">
                    <div class="method-item">
                        <div class="method-number">01</div>
                        <div class="method-content">
                            <div class="method-title">验证速度</div>
                            <div class="method-desc">用 AI 做市场分析，把可行性调研从 6 个月压缩到 3 周。</div>
                        </div>
                    </div>
                    <div class="method-item">
                        <div class="method-number">02</div>
                        <div class="method-content">
                            <div class="method-title">降低试错成本</div>
                            <div class="method-desc">AI 辅助商业模型推演，在投大钱之前先算清楚。</div>
                        </div>
                    </div>
                    <div class="method-item">
                        <div class="method-number">03</div>
                        <div class="method-content">
                            <div class="method-title">人才杠杆</div>
                            <div class="method-desc">用 AI 武装的小团队，做出以前需要大团队才能完成的工作。</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="footer-quote">
                「第二曲线的竞争，不是大公司 vs 小公司，是带 AI 的决策者 vs 不带 AI 的决策者。」
            </div>
        </div>
    </div>
</body>
</html>
