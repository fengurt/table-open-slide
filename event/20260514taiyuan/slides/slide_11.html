<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Inter:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background: #FFFFFF; 
            position: relative;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1A2639;
        }
        .content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
        }
        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #A88B52;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .headline {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 40px;
            color: #0A1626;
            font-weight: 600;
            margin-bottom: 60px;
        }
        .main-content {
            display: flex;
            flex: 1;
            align-items: center;
        }
        .left-column {
            flex: 6;
            padding-right: 60px;
        }
        .rule-item {
            position: relative;
            padding-left: 24px;
            margin-bottom: 32px;
            font-size: 20px;
            line-height: 1.6;
            color: #1A2639;
        }
        .rule-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 12px;
            width: 6px;
            height: 6px;
            background-color: #A88B52;
            border-radius: 50%;
        }
        .right-column {
            flex: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .quote-mark {
            font-family: 'Cormorant Garamond', serif;
            font-size: 180px;
            color: rgba(168, 139, 82, 0.15);
            line-height: 1;
            margin-bottom: 20px;
        }
        .lines-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            align-items: center;
        }
        .gold-line {
            height: 1px;
            background-color: #A88B52;
        }
        .gold-line:nth-child(1) { width: 120px; }
        .gold-line:nth-child(2) { width: 180px; }
        .gold-line:nth-child(3) { width: 120px; }
        
        .footer {
            margin-top: auto;
            padding-top: 40px;
            border-top: 1px solid rgba(10, 22, 38, 0.1);
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 24px;
            color: #0A1626;
            font-style: italic;
            text-align: center;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <div class="eyebrow">SLIDE 46 · ROUNDTABLE OPENS</div>
            <h2 class="headline">现在，把问题放回到桌上</h2>
            
            <div class="main-content">
                <div class="left-column">
                    <div class="rule-item">今天签到时收集到的问题，将匿名呈现在大屏。</div>
                    <div class="rule-item">我们不评判问题的大小，只关心它对你的真实压力。</div>
                    <div class="rule-item">接下来 30 分钟：每个问题，最多三人回应，先讲事实，再讲判断。</div>
                </div>
                
                <div class="right-column">
                    <div class="quote-mark">"</div>
                    <div class="lines-container">
                        <div class="gold-line"></div>
                        <div class="gold-line"></div>
                        <div class="gold-line"></div>
                    </div>
                </div>
            </div>
            
            <div class="footer">
                你不是来听课的，你是来被看见的。
            </div>
        </div>
    </div>
</body>
</html>
