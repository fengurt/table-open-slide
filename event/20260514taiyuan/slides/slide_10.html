<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Inter:wght@300;400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background: #FFFFFF; 
            position: relative;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1A2639;
        }
        .watermark {
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Cormorant Garamond', serif;
            font-size: 500px;
            color: rgba(229, 220, 197, 0.3); /* Faint gold */
            line-height: 1;
            z-index: 1;
            user-select: none;
        }
        .vertical-marker {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #A88B52;
            letter-spacing: 4px;
            text-transform: uppercase;
            z-index: 2;
            white-space: nowrap;
        }
        .content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 120px 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }
        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: #A88B52;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .eyebrow-line {
            width: 60px;
            height: 1px;
            background-color: #A88B52;
            margin-bottom: 40px;
        }
        .main-title {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 64px;
            color: #0A1626;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.2;
        }
        .subtitle {
            font-size: 32px;
            color: #1A2639;
            font-weight: 300;
            opacity: 0.8;
        }
        .footer {
            position: absolute;
            bottom: 60px;
            left: 120px;
            display: flex;
            align-items: center;
        }
        .footer-line {
            width: 40px;
            height: 1px;
            background-color: #A88B52;
            margin-right: 20px;
        }
        .tagline {
            font-size: 16px;
            color: #A88B52;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="watermark">VII</div>
        <div class="vertical-marker">SLIDES 46 – 50</div>
        <div class="content-wrapper">
            <div>
                <div class="eyebrow">CHAPTER VII · 第七章</div>
                <div class="eyebrow-line"></div>
                <h1 class="main-title">圆桌与行动</h1>
                <h2 class="subtitle">Roundtable · Membership · Ecosystem</h2>
            </div>
        </div>
        <div class="footer">
            <div class="footer-line"></div>
            <div class="tagline">闭门圆桌 · 岁知社生态介绍</div>
        </div>
    </div>
</body>
</html>
