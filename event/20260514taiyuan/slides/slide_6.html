<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Serif+SC:wght@400;600&family=Inter:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background: #FFFFFF; 
            position: relative;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #1A2639;
        }
        .content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 80px 100px;
            display: flex;
        }
        .left-column {
            flex: 7;
            padding-right: 80px;
            display: flex;
            flex-direction: column;
        }
        .right-column {
            flex: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            border-left: 1px solid rgba(168, 139, 82, 0.3);
            padding-left: 80px;
        }
        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #A88B52;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        .headline {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 40px;
            color: #0A1626;
            font-weight: 600;
            margin-bottom: 60px;
            line-height: 1.3;
        }
        .body-section {
            margin-bottom: 40px;
        }
        .body-label {
            font-weight: 600;
            color: #0A1626;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .body-text {
            font-size: 16px;
            color: #1A2639;
            line-height: 1.6;
            opacity: 0.9;
        }
        .quote-section {
            margin-top: auto;
            padding-top: 40px;
            border-top: 2px solid #0A1626;
        }
        .quote-text {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 24px;
            color: #A88B52;
            font-style: italic;
            line-height: 1.5;
        }
        .large-numeral {
            font-family: 'Cormorant Garamond', serif;
            font-size: 200px;
            color: #A88B52;
            line-height: 1;
            margin-bottom: 24px;
        }
        .right-subtitle {
            font-size: 18px;
            color: #0A1626;
            letter-spacing: 2px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <div class="left-column">
                <div class="eyebrow">LEVEL IV · DECISION COPILOT</div>
                <h2 class="headline">AI 走进会议室，成为老板的决策副驾</h2>
                
                <div class="body-section">
                    <div class="body-label">谁在用：</div>
                    <div class="body-text">老板用 AI 做战略辅助——竞争分析、市场预判、第二曲线评估。</div>
                </div>
                
                <div class="body-section">
                    <div class="body-label">状态：</div>
                    <div class="body-text">AI 成为经营决策的基础工具，节奏化、机制化。</div>
                </div>
                
                <div class="quote-section">
                    <div class="quote-text">「我每周用 AI 做一次行业情报综合。」</div>
                </div>
            </div>
            
            <div class="right-column">
                <div class="large-numeral">IV</div>
                <div class="right-subtitle">Strategy<br>决策辅助</div>
            </div>
        </div>
    </div>
</body>
</html>
