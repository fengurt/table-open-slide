# slides.opcglobal.cn -> docx-studio container on 127.0.0.1:3333
# Install: /etc/nginx/sites-available/slides.opcglobal.cn
#          ln -s ../sites-available/slides.opcglobal.cn /etc/nginx/sites-enabled/
# Then:    certbot --nginx -d slides.opcglobal.cn   (injects the 443 block)
#
# Pre-TLS (HTTP only) form below; certbot rewrites it to add the 443 server and
# the http->https redirect, matching the other opcglobal.cn vhosts on this box.

server {
    listen 80;
    listen [::]:80;
    server_name slides.opcglobal.cn;

    # ACME http-01 challenge (certbot --nginx handles this automatically too)
    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/slides_access.log;
    error_log  /var/log/nginx/slides_error.log;
}
