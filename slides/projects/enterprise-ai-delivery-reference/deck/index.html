<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>企业级 AI 助手与 AI Worker 交付参考</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #090b0f;
        --paper: #f6f4ed;
        --white: #fffdf7;
        --graphite: #1b2028;
        --muted: #69717d;
        --line: #d8d2c5;
        --gold: #b88a3b;
        --gold-2: #e0bd75;
        --red: #b43a2f;
        --blue: #185c8f;
        --green: #18715f;
        --violet: #6554b8;
        --shadow: 0 28px 70px rgba(9, 11, 15, 0.18);
        font-family:
          "Aptos",
          "PingFang SC",
          "Microsoft YaHei",
          system-ui,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070a;
        color: var(--ink);
      }

      button {
        font: inherit;
      }

      .deck {
        display: grid;
        place-items: center;
        width: 100vw;
        height: 100vh;
      }

      .slide {
        position: relative;
        display: none;
        width: min(100vw, 177.7778vh);
        height: min(56.25vw, 100vh);
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(9, 11, 15, 0.055) 1px, transparent 1px),
          linear-gradient(180deg, rgba(9, 11, 15, 0.055) 1px, transparent 1px),
          var(--paper);
        background-size: 42px 42px;
      }

      .slide.active {
        display: block;
      }

      .slide::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 8% 0%, rgba(184, 138, 59, 0.22), transparent 28%),
          linear-gradient(135deg, rgba(255, 255, 255, 0) 0 66%, rgba(184, 138, 59, 0.12) 66% 66.3%, transparent 66.3%);
      }

      .page {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 16px;
        width: 100%;
        height: 100%;
        padding: 32px 48px 26px;
      }

      header,
      footer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 22px;
        align-items: center;
      }

      header {
        border-bottom: 2px solid var(--ink);
        padding-bottom: 9px;
      }

      footer {
        border-top: 1px solid var(--line);
        padding-top: 9px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        color: var(--ink);
        font-weight: 950;
        letter-spacing: 0.08em;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 2px solid var(--ink);
        background: var(--ink);
        color: var(--gold-2);
        font-family: Georgia, serif;
        font-size: 16px;
        font-weight: 900;
      }

      .case-no {
        color: var(--ink);
        font-family: Georgia, "Noto Serif SC", serif;
        font-size: 18px;
        font-weight: 900;
        white-space: nowrap;
      }

      .case-kicker {
        margin: 0 0 9px;
        color: var(--gold);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.18em;
        line-height: 1;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1,
      h2 {
        color: var(--ink);
        font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
        letter-spacing: 0;
      }

      h1 {
        max-width: 1010px;
        font-size: clamp(39px, 4.35vw, 66px);
        line-height: 1.05;
      }

      h2 {
        max-width: 1040px;
        font-size: clamp(29px, 3.05vw, 46px);
        line-height: 1.08;
      }

      .lead {
        max-width: 1030px;
        color: var(--graphite);
        font-size: clamp(18px, 1.6vw, 25px);
        font-weight: 760;
        line-height: 1.36;
      }

      .content {
        display: grid;
        grid-template-columns: 0.92fr 1.08fr;
        gap: 18px;
        min-height: 0;
        align-items: stretch;
      }

      .case-card {
        display: grid;
        gap: 12px;
        align-content: start;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: rgba(255, 253, 247, 0.94);
        box-shadow: var(--shadow);
      }

      .case-card strong {
        color: var(--ink);
        font-size: clamp(18px, 1.45vw, 23px);
        line-height: 1.2;
      }

      .case-card p,
      li,
      td {
        color: var(--graphite);
        font-size: clamp(13px, 0.98vw, 16px);
        line-height: 1.42;
      }

      .label {
        display: inline-flex;
        width: max-content;
        border: 1px solid rgba(184, 138, 59, 0.5);
        padding: 7px 10px;
        color: var(--gold);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .visual {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
        min-height: 0;
        border: 1px solid var(--ink);
        border-radius: 8px;
        padding: 16px;
        background:
          linear-gradient(135deg, rgba(9, 11, 15, 0.96), rgba(27, 32, 40, 0.94)),
          var(--ink);
        color: var(--white);
        overflow: hidden;
      }

      .visual::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
          radial-gradient(circle at 82% 18%, rgba(184, 138, 59, 0.32), transparent 32%);
        background-size: 36px 36px, 36px 36px, auto;
        pointer-events: none;
      }

      .visual > * {
        position: relative;
        z-index: 1;
      }

      .metric-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        min-height: 66px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 6px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.06);
      }

      .metric b {
        display: block;
        color: var(--gold-2);
        font-size: clamp(17px, 1.42vw, 23px);
        line-height: 1.08;
      }

      .metric span {
        display: block;
        margin-top: 6px;
        color: rgba(255, 253, 247, 0.74);
        font-size: clamp(11px, 0.82vw, 13px);
        font-weight: 700;
        line-height: 1.25;
      }

      .workflow {
        display: grid;
        gap: 10px;
        align-content: start;
      }

      .step {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 12px;
        align-items: start;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        padding-top: 9px;
      }

      .step b {
        color: var(--gold-2);
        font-family: Georgia, serif;
        font-size: 20px;
      }

      .step span {
        color: rgba(255, 253, 247, 0.86);
        font-size: clamp(13px, 0.98vw, 16px);
        font-weight: 720;
        line-height: 1.34;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 8px 0;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .nav {
        position: absolute;
        right: 28px;
        bottom: 22px;
        z-index: 5;
        display: flex;
        gap: 8px;
        align-items: center;
        border: 1px solid rgba(9, 11, 15, 0.12);
        border-radius: 8px;
        padding: 8px;
        background: rgba(255, 253, 247, 0.9);
        box-shadow: 0 12px 30px rgba(9, 11, 15, 0.16);
      }

      .nav button {
        width: 40px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--white);
        color: var(--ink);
        cursor: pointer;
        font-size: 19px;
      }

      .nav span {
        min-width: 58px;
        color: var(--ink);
        text-align: center;
        font-size: 14px;
        font-weight: 900;
      }

      @media print {
        html,
        body,
        .deck {
          width: 100%;
          height: auto;
          background: #fff;
        }

        .slide {
          display: block;
          width: 100vw;
          height: 56.25vw;
          page-break-after: always;
        }

        .nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="deck" id="deck" aria-label="企业级 AI 助手与 AI Worker 交付参考"></main>
    <script>
      const cases = [

          tag: "PMO Worker",
          scene: "项目周报、风险、纪要、待办分散在不同工具里，管理者难以及时掌握。",
          action: "汇总会议纪要、任务状态、风险阻塞，自动生成周报和升级提醒。",
          data: "项目计划、会议纪要、任务系统、风险清单、交付物目录。",
          output: "周报自动化、风险升级及时、待办责任明确。",
          metrics: [["周报", "自动生成"], ["风险", "升级提醒"], ["责任", "到人到期"]],
          steps: ["汇总项目证据", "识别延期与阻塞", "生成周报", "推送升级提醒"]
        },
        {
          title: "知识库运营中台",
          tag: "Knowledge Ops",
          scene: "知识库上线后无人运营，过期内容、冲突口径和未解答问题持续累积。",
          action: "监控命中率、未回答、低满意答案，自动生成知识更新任务和责任人。",
          data: "知识条目、问答日志、满意度、引用来源、内容责任人。",
          output: "知识命中率提升、过期内容下降、问题闭环可追踪。",
          metrics: [["命中率", "持续优化"], ["未解答", "自动建单"], ["责任人", "内容治理"]],
          steps: ["分析问答日志", "识别知识缺口", "派发更新任务", "复测答案质量"]
        },
        {
          title: "合规风险预警助手",
          tag: "Compliance Monitor",
          scene: "销售、采购、客服、合同流程中存在敏感承诺、违规条款和高风险表达。",
          action: "监控文本与流程动作，识别风险表达，提示替代表述并触发复核。",
          data: "合规规则、敏感词库、合同/聊天/邮件、审批记录。",
          output: "风险拦截率、复核闭环、违规表达下降。",
          metrics: [["实时", "风险识别"], ["替代", "合规话术"], ["复核", "自动触发"]],
          steps: ["扫描业务文本", "匹配风险规则", "生成修改建议", "触发人工复核"]
        },
        {
          title: "AI 交付运营看板",
          tag: "Delivery Control Tower",
          scene: "AI 项目上线后难证明价值，客户只看到演示，看不到真实使用、节省和风险。",
          action: "统一展示使用量、解决率、任务完成率、人工兜底、知识沉淀和 ROI。",
          data: "问答日志、任务执行、工单、人工转接、成本与工时基线。",
          output: "验收证据、月度复盘、二期扩展路线图。",
          metrics: [["ROI", "持续呈现"], ["验收", "证据化"], ["路线图", "自动建议"]],
          steps: ["汇总使用数据", "计算效率收益", "识别扩展场景", "生成复盘报告"]
        }
      ];

      const total = cases.length;

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function renderSlide(item, index) {
        const no = `${String(index + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
        return `<section class="slide" data-index="${index + 1}" aria-label="${escapeHtml(item.title)}">
          <div class="page">
            <header>
              <div class="brand"><span class="brand-mark">T</span><span>TABLE AI · DELIVERY CASEBOOK</span></div>
              <div class="case-no">${no}</div>
            </header>
            <div>
              <p class="case-kicker">${escapeHtml(item.tag)}</p>
              <h2>${escapeHtml(item.title)}</h2>
            </div>
            <div class="content">
              <section class="case-card">
                <span class="label">Direct Case</span>
                <p class="lead">${escapeHtml(item.scene)}</p>
                <table>
                  <tbody>
                    <tr><th>AI Worker</th><td>${escapeHtml(item.action)}</td></tr>
                    <tr><th>接入资料</th><td>${escapeHtml(item.data)}</td></tr>
                    <tr><th>验收结果</th><td>${escapeHtml(item.output)}</td></tr>
                  </tbody>
                </table>
              </section>
              <section class="visual">
                <div class="metric-row">
                  ${item.metrics
                    .map(([value, label]) => `<div class="metric"><b>${escapeHtml(value)}</b><span>${escapeHtml(label)}</span></div>`)
                    .join("")}
                </div>
                <div class="workflow">
                  ${item.steps
                    .map((step, i) => `<div class="step"><b>${String(i + 1).padStart(2, "0")}</b><span>${escapeHtml(step)}</span></div>`)
                    .join("")}
                </div>
              </section>
            </div>
            <footer><span>TABLE AI BRAND SYSTEM</span><span>ANONYMIZED PARTY-B DELIVERY REFERENCE</span></footer>
          </div>
        </section>`;
      }

      const deck = document.getElementById("deck");
      deck.innerHTML = cases.map(renderSlide).join("");

      const nav = document.createElement("div");
      nav.className = "nav";
      nav.innerHTML = `<button type="button" aria-label="上一页" data-dir="-1">&#8249;</button><span id="navCount">1 / ${total}</span><button type="button" aria-label="下一页" data-dir="1">&#8250;</button>`;
      deck.appendChild(nav);

      let current = 1;

      function show(index, updateHash = true) {
        current = Math.max(1, Math.min(total, index));
        document.querySelectorAll(".slide").forEach((slide) => {
          slide.classList.toggle("active", Number(slide.dataset.index) === current);
        });
        document.getElementById("navCount").textContent = `${current} / ${total}`;
        if (updateHash) history.replaceState(null, "", `#${current}`);
      }

      nav.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-dir]");
        if (!button) return;
        show(current + Number(button.dataset.dir));
      });

      window.addEventListener("keydown", (event) => {
        if (["ArrowRight", "PageDown", " "].includes(event.key)) show(current + 1);
        if (["ArrowLeft", "PageUp", "Backspace"].includes(event.key)) show(current - 1);
        if (event.key === "Home") show(1);
        if (event.key === "End") show(total);
      });

      window.addEventListener("hashchange", () => {
        const requested = Number(location.hash.replace("#", ""));
        if (requested) show(requested, false);
      });

      show(Number(location.hash.replace("#", "")) || 1, false);
    </script>
  </body>
</html>
