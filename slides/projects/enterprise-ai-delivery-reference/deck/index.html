      const slides = [
        ...cases.map((item, index) => {

            type: "demo",
            file: `demo-${no}.svg`,
            code: `D${no}`,
            scene: item.brief,
            action: item.points.join("；"),
            data: item.tabs.join(" / "),
            output: item.actions.join("；"),
          };
        }),
      ];
      const total = slides.length;
      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }
      function prototypeSrc(file) {
        const rel = `slides/projects/enterprise-ai-delivery-reference/assets/prototypes/${file}`;
        if (location.protocol === "file:") return `../assets/prototypes/${file}`;
        return `/api/asset?path=${encodeURIComponent(rel)}`;
      }
      function metricHtml(item) {
        return (item.metrics || item.cards || [])
          .map(
            (metric) =>
              `<div class="metric"><b>${escapeHtml(metric[0])}</b><span>${escapeHtml(metric[1])}</span></div>`,
          )
          .join("");
      }
      function renderSlide(item, index) {
        const no = `${String(index + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
        const kind = item.type === "demo" ? "Demo Prototype" : "AI Worker Case";
        const result = item.output || (item.actions ? item.actions.join("；") : "客户演示与方案澄清原型参考。");
        return `<section class="slide" data-index="${index + 1}" aria-label="${escapeHtml(item.title)}"><div class="page"><aside class="rail"><div class="mark">T</div><div class="rail-word">TABLE AI CASEBOOK</div><div class="rail-no"><b>${escapeHtml(item.code)}</b><span>${no}</span></div></aside><main class="stage"><header class="topbar"><div class="brand">Table AI · Enterprise Prototype Portfolio</div><div class="kind">${escapeHtml(kind)}</div></header><div class="layout"><section class="copy"><p class="kicker">${escapeHtml(item.tag)}</p><h1>${escapeHtml(item.title)}</h1><p class="summary">${escapeHtml(item.scene || item.brief)}</p><div class="brief"><div class="brief-row"><b>Worker</b><span>${escapeHtml(item.action)}</span></div><div class="brief-row"><b>Data</b><span>${escapeHtml(item.data)}</span></div><div class="brief-row"><b>Result</b><span>${escapeHtml(result)}</span></div></div><div class="metrics">${metricHtml(item)}</div></section><figure class="shot"><img src="${prototypeSrc(item.file)}" alt="${escapeHtml(item.title)} prototype screenshot" /><figcaption class="shot-caption"><span>${escapeHtml(item.code)} · inserted prototype</span><span>${escapeHtml(kind)}</span></figcaption></figure></div><footer class="foot"><span>Client-facing demo reference</span><span>All visuals are local prototype assets</span></footer></main></div></section>`;
      }
      const deck = document.getElementById("deck");
      deck.innerHTML = slides.map(renderSlide).join("");
      const nav = document.createElement("div");
      nav.className = "nav";
      nav.innerHTML = `<button type="button" aria-label="上一页" data-dir="-1">&#8249;</button><span id="navCount">1 / ${total}</span><button type="button" aria-label="下一页" data-dir="1">&#8250;</button>`;
      deck.appendChild(nav);
      let current = 1;
      function show(index, updateHash = true) {
        current = Math.max(1, Math.min(total, index));
        document.querySelectorAll(".slide").forEach((slide) => {
          slide.classList.toggle("active", Number(slide.dataset.index) === current);
        });
        document.getElementById("navCount").textContent = `${current} / ${total}`;
        if (updateHash) history.replaceState(null, "", `#${current}`);
      }
      nav.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-dir]");
        if (!button) return;
        show(current + Number(button.dataset.dir));
      });
      window.addEventListener("keydown", (event) => {
        if (["ArrowRight", "PageDown", " "].includes(event.key)) show(current + 1);
        if (["ArrowLeft", "PageUp", "Backspace"].includes(event.key)) show(current - 1);
        if (event.key === "Home") show(1);
        if (event.key === "End") show(total);
      });
      window.addEventListener("hashchange", () => {
        const requested = Number(location.hash.replace("#", ""));
        if (requested) show(requested, false);
      });
      show(Number(location.hash.replace("#", "")) || 1, false);
