<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #0A1626;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .content-wrapper {
            text-align: center;
            width: 80%;
            margin-top: -20px;
        }
        .logo-container {
            margin-bottom: 50px;
        }
        .logo-container img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
        .main-title {
            font-size: 80px;
            color: #FFFFFF;
            font-weight: 700;
            letter-spacing: 6px;
            margin-bottom: 20px;
        }
        .divider {
            width: 120px;
            height: 2px;
            background-color: #A88B52;
            margin: 0 auto 30px auto;
        }
        .subtitle-cn {
            font-size: 28px;
            color: #A88B52;
            font-weight: 500;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }
        .subtitle-en {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 60px;
        }
        .slogan-container {
            display: inline-block;
            border: 1px solid rgba(168, 139, 82, 0.4);
            padding: 12px 50px;
            margin-bottom: 50px;
        }
        .slogan-text {
            font-size: 24px;
            color: #A88B52;
            font-weight: 700;
            letter-spacing: 12px;
        }
        .url-text {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
            letter-spacing: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <div class="logo-container">
                <img src="/home/ubuntu/opc_global_presentation/a2a_logo_white.png" alt="Logo" />
            </div>
            <div class="main-title">OPC Global</div>
            <div class="divider"></div>
            <div class="subtitle-cn">一人公司全球联盟</div>
            <div class="subtitle-en">One Person Company Global Alliance</div>
            <div class="slogan-container">
                <div class="slogan-text">智启自由</div>
            </div>
            <div class="url-text">opcglobal.ai</div>
        </div>
    </div>
</body>
</html>
