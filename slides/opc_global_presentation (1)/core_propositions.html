        .slide-container {
            width: 1280px;
            min-height: 720px;

        .header {

        }

            background-color: #A88B52;
        }
.content-area {
            margin-left: 100px;
            margin-right: 100px;
            margin-top: 20px;
        }
.proposition-row {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(168, 139, 82, 0.3);

        }

        }

            font-size: 80px;
            color: #A88B52;
            font-weight: 700;
            width: 160px;
            line-height: 1;
            letter-spacing: -2px;
        }
.prop-content {
            flex: 1;
        }
.prop-title {
            font-size: 28px;
            color: #0A1626;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
.prop-en {
            font-size: 14px;
            color: #A88B52;
            font-weight: 500;
            letter-spacing: 2px;
            margin-left: 20px;
            text-transform: uppercase;
            border-left: 2px solid #0A1626;
            padding-left: 20px;
        }
.prop-desc {
            font-size: 18px;
            color: rgba(10, 22, 38, 0.8);
            font-weight: 300;
            line-height: 1.6;
            max-width: 850px;
        }
.logo-watermark {
            position: absolute;
            bottom: 30px;
            right: 40px;
        }
        .logo-watermark img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            opacity: 0.3;
        }

</head>
