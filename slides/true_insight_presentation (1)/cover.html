<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #0A1626;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .content-wrapper {
            text-align: center;
            width: 80%;
        }
        .logo-container {
            margin-bottom: 30px;
        }
        .logo-container img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        .main-title {
            font-size: 64px;
            color: #FFFFFF;
            font-weight: 700;
            letter-spacing: 8px;
            margin-bottom: 30px;
        }
        .divider {
            width: 120px;
            height: 2px;
            background-color: #A88B52;
            margin: 0 auto 30px auto;
        }
        .subtitle {
            font-size: 32px;
            color: #FFFFFF;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .tagline {
            font-size: 24px;
            color: #A88B52;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 60px;
        }
        .bottom-line {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            letter-spacing: 1px;
            position: absolute;
            bottom: 60px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <div class="logo-container">
                <img src="/home/ubuntu/true_insight_presentation/a2a_logo_white.png" alt="Logo" />
            </div>
            <div class="main-title">真知灼见</div>
            <div class="divider"></div>
            <div class="subtitle">以专业报告为核心的产品评估与优势诠释解决方案</div>
            <div class="tagline">跨越同质化内卷，重塑品牌话语权与客群心智占有率</div>
        </div>
        <div class="bottom-line">True Insight: Product Evaluation & Advantage Interpretation Solution</div>
    </div>
</body>
</html>
