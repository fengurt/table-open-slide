<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #0A1626;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 0 150px;
            text-align: center;
        }
.quote-icon {
            font-size: 80px;
            color: #A88B52;
            opacity: 0.5;
            margin-bottom: 30px;
            font-family: serif;
            line-height: 1;
        }
.main-quote {
            font-size: 36px;
            color: #FFFFFF;
            font-weight: 500;
            line-height: 1.6;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }
.highlight {
            color: #A88B52;
            font-weight: 700;
        }
.divider {
            width: 120px;
            height: 2px;
            background-color: #A88B52;
            margin: 0 auto 40px auto;
        }
.sub-quote {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
            line-height: 1.8;
            letter-spacing: 1px;
        }
.logo-watermark {
            position: absolute;
            bottom: 30px;
            right: 40px;
        }
        .logo-watermark img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            opacity: 0.5;
        }
    </style>
</head>
<body><div class="slide-container">
        <div class="quote-icon">"</div>
<div class="main-quote">常规的参数对比只是工具，专家共识是催化剂。<br>选择我们，打造属于你的<br><span style="color: rgb(168, 139, 82); font-weight: 700">“优势发现与诠释的战略工程系统”</span>。</div>
<div class="divider"></div>
<div class="sub-quote">谢谢</div>
<div class="logo-watermark"><img src="/home/ubuntu/true_insight_presentation/a2a_logo_white.png" alt="Logo"></div>
    </div>
</body>
</html>
