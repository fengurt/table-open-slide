<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #0A1626; /* Deep Blue Background */
            font-family: 'Google Sans', 'Noto Sans SC', sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
        }
        .quote-container {
            text-align: center;
            margin-top: -60px; /* Adjust vertical center slightly up */
        }
        .quote-text {
            color: #FFFFFF;
            font-size: 42px;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .quote-highlight {
            color: #A88B52;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 3px;
        }
        .contact-info {
            position: absolute;
            bottom: 80px;
            text-align: center;
            border-top: 1px solid #A88B52;
            padding-top: 30px;
            width: 600px;
        }
        .contact-name {
            color: #FFFFFF;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .contact-title {
            color: #A88B52;
            font-size: 16px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .footer {
            position: absolute;
            bottom: 30px;
            left: 80px;
            right: 80px;
            color: #7F8C8D;
            font-size: 14px;
            font-weight: 300;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        
        <div class="quote-container">
            <div class="quote-text">
                "传统大学服务于 18-22 岁的人生阶段；<br>
                TABLE AI 服务于人在 AI 时代的持续成长与协作。"
            </div>
            <div class="quote-highlight">
                投资 AI 时代人的成长与协作底座。
            </div>
        </div>

        <div style="text-align: center; max-width: 720px; margin: 30px auto 0;">
            <div style="color: #A88B52; font-size: 18px; font-style: italic; line-height: 1.6;">"教育是改变世界最强大的武器。"</div>
            <div style="color: #FFFFFF; font-size: 13px; font-weight: 400; margin-top: 8px; letter-spacing: 1px; opacity: 0.7;">— 纳尔逊·曼德拉</div>
        </div>

        <div class="contact-info">
            <div class="contact-name">郭峰 (Guo Feng)</div>
            <div class="contact-title">CEO · TABLE AI</div>
        </div>

        <div class="footer">
            <span>终极叩问</span>
            <span>TABLE AI · Confidential · 2026</span>
        </div>
    </div>
</body>
</html>
