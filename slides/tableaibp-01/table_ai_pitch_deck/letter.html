<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            font-family: 'Google Sans', 'Noto Sans SC', sans-serif;
            position: relative;
            padding-top: 80px;
            padding-left: 80px;
            padding-right: 80px;
        }
        .content-wrapper {
            display: flex;
            justify-content: space-between;
            height: 500px;
            align-items: center;
        }
        .left-col {
            width: 35%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .right-col {
            width: 60%;
        }
        .title {
            color: #0A1626;
            font-size: 48px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 40px;
        }
        .signature {
            color: #A88B52;
            font-size: 20px;
            font-weight: 400;
        }
        .signature-title {
            color: #2C3E50;
            font-size: 16px;
            font-weight: 300;
            margin-top: 5px;
        }
        .quote-block {
            border-left: 4px solid #A88B52;
            padding-left: 40px;
        }
        .quote-text {
            color: #2C3E50;
            font-size: 24px;
            font-weight: 300;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .footer {
            position: absolute;
            bottom: 40px;
            left: 80px;
            right: 80px;
            color: #2C3E50;
            font-size: 14px;
            font-weight: 300;
            border-top: 1px solid #A88B52;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <div class="left-col">
                <div class="title">我们寻找在长期价值上达成共识的同道</div>
                <div style="margin-top: 40px;">
                    <div class="signature">郭峰</div>
                    <div class="signature-title">TABLE AI CEO / OPC Global 创始人</div>
                </div>
            </div>
            <div class="right-col">
                <div class="quote-block">
                    <div class="quote-text">
                        "在 AI 重塑人类文明的关键节点，我们正在建立的，不是一家追求短期退出的软件公司，而是 AI 时代人的成长与协作底座。
                    </div>
                    <div class="quote-text">
                        如果您在寻找 3-5 年翻 10 倍的标的，我们诚挚地建议您选择更适合的项目。
                    </div>
                    <div class="quote-text" style="font-weight: 400; color: #0A1626;">
                        如果您拥有跨越周期的耐心、重塑文明的野心，相信教育与协作的真正变革——请坐上这张桌子。"
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            <span>致投资人的一封信</span>
            <span>TABLE AI · Confidential · 2026</span>
        </div>
    </div>
</body>
</html>
