<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            font-family: 'Google Sans', 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .title {
            color: #0A1626;
            font-size: 64px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #0A1626;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 40px;
        }
        .separator {
            width: 120px;
            height: 2px;
            background-color: #A88B52;
            margin-bottom: 40px;
        }
        .core-phrase {
            color: #A88B52;
            font-size: 24px;
            font-style: italic;
            font-weight: 300;
        }
        .footer {
            position: absolute;
            bottom: 40px;
            color: #2C3E50;
            font-size: 16px;
            font-weight: 300;
            border-top: 1px solid #A88B52;
            padding-top: 10px;
            width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="title">TABLE AI 泰博乐</div>
        <div class="subtitle">AI 时代的无界学院</div>
        <div class="separator"></div>
        <div class="core-phrase">善用 AI · 终获自由</div>
        <div class="footer">商业计划书 v10 · 香港泰博乐科技有限公司 · 2026</div>
    </div>
</body>
</html>
