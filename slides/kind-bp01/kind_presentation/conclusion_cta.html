<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; background: #0B0F19; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background: #0B0F19;
        color: #F1F5F9;
        font-family: 'Work Sans', sans-serif;
        display: flex;
        position: relative;
        overflow: hidden;
      }
      .left-panel {
        width: 60%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 2px solid #38BDF8;
      }
      .right-panel {
        width: 40%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-left: 60px;
        background: rgba(14, 165, 233, 0.05);
      }
      .big-text {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 180px;
        color: #0EA5E9;
        line-height: 0.8;
        letter-spacing: -8px;
        text-align: center;
      }
      .cta-title {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 48px;
        color: #F1F5F9;
        margin-bottom: 20px;
        line-height: 1.2;
      }
      .cta-desc {
        font-size: 24px;
        color: #CBD5E1;
        margin-bottom: 60px;
        line-height: 1.5;
      }
      .footer-brand {
        font-size: 20px;
        color: #38BDF8;
        text-transform: uppercase;
        letter-spacing: 4px;
        border-top: 1px solid #38BDF8;
        padding-top: 20px;
        width: fit-content;
      }
      .circle-decoration {
        position: absolute;
        width: 300px;
        height: 300px;
        border: 40px solid #38BDF8;
        border-radius: 50%;
        top: -100px;
        right: -100px;
        opacity: 0.2;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="circle-decoration"></div>
        <div class="left-panel">
            <h1 class="big-text">FOR<br>ALL</h1>
        </div>
        <div class="right-panel">
            <h2 class="cta-title">Join the Revolution</h2>
            <p class="cta-desc">Democratizing high-end expertise for every individual and enterprise. Let's build the future of expertise together.</p>
            <div class="footer-brand">
                <strong>KiND FOR ALL</strong><br>
                Not for few. For all.
            </div>
        </div>
    </div>
</body>
</html>
