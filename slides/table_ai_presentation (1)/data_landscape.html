<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            font-family: 'Noto Sans SC', sans-serif;
            position: relative;
            padding-top: 80px;
        }
        .header {
            margin-left: 100px;
            margin-right: 100px;
            margin-bottom: 60px;
        }
        .title {
            font-size: 32px;
            color: #0A1626;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 20px;
            color: rgba(10, 22, 38, 0.6);
            font-weight: 300;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .divider {
            width: 80px;
            height: 2px;
            background-color: #A88B52;
        }
        .dashboard-container {
            margin-left: 100px;
            margin-right: 100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 60px 80px;
        }
        .data-card {
            display: flex;
            flex-direction: column;
            border-top: 2px solid #0A1626;
            padding-top: 20px;
        }
        .data-number {
            font-size: 56px;
            color: #A88B52;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1;
            letter-spacing: 1px;
        }
        .data-desc {
            font-size: 20px;
            color: #0A1626;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 1px;
            height: 60px;
        }
        .bar-track {
            width: 100%;
            height: 4px;
            background-color: rgba(10, 22, 38, 0.1);
            position: relative;
        }
        .bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #A88B52;
        }
        .sources {
            position: absolute;
            bottom: 40px;
            left: 100px;
            font-size: 14px;
            color: rgba(10, 22, 38, 0.5);
            font-weight: 300;
            letter-spacing: 1px;
        }
        .logo-watermark {
            position: absolute;
            bottom: 30px;
            right: 40px;
        }
        .logo-watermark img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="title">全球智能体经济数据全景</div>
            <div class="subtitle">Global Agentic Economy Data Landscape</div>
            <div class="divider"></div>
        </div>
        
        <div class="dashboard-container">
            <div class="data-card">
                <div class="data-number">$4,500亿+</div>
                <div class="data-desc">Agentic AI预计2035年企业软件收入<br><span style="font-size: 14px; font-weight: 300; color: rgba(10, 22, 38, 0.6);">(Gartner, 2025)</span></div>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 100%;"></div>
                </div>
            </div>
            
            <div class="data-card">
                <div class="data-number">22.16亿</div>
                <div class="data-desc">2030年全球活跃AI Agent数量<br><span style="font-size: 14px; font-weight: 300; color: rgba(10, 22, 38, 0.6);">(IDC, 2026)</span></div>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 80%;"></div>
                </div>
            </div>
            
            <div class="data-card">
                <div class="data-number">40%</div>
                <div class="data-desc">2026年底企业应用集成AI Agent比例<br><span style="font-size: 14px; font-weight: 300; color: rgba(10, 22, 38, 0.6);">(Gartner, 2025)</span></div>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 40%;"></div>
                </div>
            </div>
            
            <div class="data-card">
                <div class="data-number">92%</div>
                <div class="data-desc">组织未系统性捕获退休专家知识<br><span style="font-size: 14px; font-weight: 300; color: rgba(10, 22, 38, 0.6);">(APQC, 2025)</span></div>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 92%;"></div>
                </div>
            </div>
        </div>

        <div class="sources">
            数据来源：Gartner, IDC, APQC, World Bank, UNESCO
        </div>
        <div class="logo-watermark"><img src="/home/ubuntu/table_ai_presentation/a2a_logo_dark.png" alt="Logo" /></div>
    </div>
</body>
</html>
