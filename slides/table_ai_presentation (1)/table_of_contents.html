<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #FFFFFF;
            font-family: 'Noto Sans SC', sans-serif;
            position: relative;
            padding-top: 80px;
        }
        .header {
            margin-left: 100px;
            margin-right: 100px;
            margin-bottom: 60px;
        }
        .title {
            font-size: 32px;
            color: #0A1626;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .divider {
            width: 80px;
            height: 2px;
            background-color: #A88B52;
        }
        .content-container {
            display: flex;
            margin-left: 100px;
            margin-right: 100px;
            height: 450px;
        }
        .left-bar {
            width: 4px;
            background-color: #0A1626;
            margin-right: 60px;
            position: relative;
        }
        .left-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100px;
            background-color: #A88B52;
        }
        .list-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }
        .list-item {
            display: flex;
            align-items: center;
        }
        .item-number {
            font-size: 24px;
            color: #A88B52;
            font-weight: 700;
            width: 40px;
        }
        .item-text {
            font-size: 24px;
            color: #0A1626;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .item-eng {
            font-size: 18px;
            color: rgba(10, 22, 38, 0.6);
            font-weight: 300;
            margin-left: 20px;
            letter-spacing: 1px;
        }
        .logo-watermark {
            position: absolute;
            bottom: 30px;
            right: 40px;
        }
        .logo-watermark img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <div class="title">战略框架总览 Strategic Framework Overview</div>
            <div class="divider"></div>
        </div>
        <div class="content-container">
            <div class="left-bar"></div>
            <div class="list-container">
                <div class="list-item">
                    <div class="item-number">01</div>
                    <div class="item-text">宏观趋势分析</div>
                    <div class="item-eng">Macro Trend Analysis</div>
                </div>
                <div class="list-item">
                    <div class="item-number">02</div>
                    <div class="item-text">品牌哲学与隐喻</div>
                    <div class="item-eng">Brand Philosophy</div>
                </div>
                <div class="list-item">
                    <div class="item-number">03</div>
                    <div class="item-text">核心理念与价值</div>
                    <div class="item-eng">Core Values</div>
                </div>
                <div class="list-item">
                    <div class="item-number">04</div>
                    <div class="item-text">AHA 架构解析</div>
                    <div class="item-eng">AHA Architecture</div>
                </div>
                <div class="list-item">
                    <div class="item-number">05</div>
                    <div class="item-text">业务版图</div>
                    <div class="item-eng">Business Landscape</div>
                </div>
                <div class="list-item">
                    <div class="item-number">06</div>
                    <div class="item-text">生态合作网络</div>
                    <div class="item-eng">Ecosystem Network</div>
                </div>
                <div class="list-item">
                    <div class="item-number">07</div>
                    <div class="item-text">战略展望</div>
                    <div class="item-eng">Strategic Outlook</div>
                </div>
            </div>
        </div>
        <div class="logo-watermark"><img src="/home/ubuntu/table_ai_presentation/a2a_logo_dark.png" alt="Logo" /></div>
    </div>
</body>
</html>
