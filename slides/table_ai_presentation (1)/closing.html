<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #0A1626;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .quote-container {
            text-align: center;
            width: 80%;
            margin-bottom: 80px;
        }
        .main-quote {
            font-size: 48px;
            color: #FFFFFF;
            font-weight: 500;
            letter-spacing: 4px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .eng-quote {
            font-size: 24px;
            color: #A88B52;
            font-weight: 300;
            letter-spacing: 2px;
            font-style: italic;
        }
        .divider {
            width: 60px;
            height: 2px;
            background-color: #A88B52;
            margin: 0 auto 40px auto;
        }
        .brand-container {
            text-align: center;
            position: absolute;
            bottom: 80px;
        }
        .brand-name {
            font-size: 28px;
            color: #FFFFFF;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            letter-spacing: 2px;
        }
        .logo-watermark {
            position: absolute;
            bottom: 30px;
            right: 40px;
        }
        .logo-watermark img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            opacity: 0.3;
        }
    </style>
</head>
<body><div class="slide-container">
        <div class="quote-container">
            <div class="main-quote">人类文明的每一次重大飞跃，<br>都源于一次伟大的相聚。</div>
            <div class="eng-quote">Every great leap of human civilization begins with a great gathering.</div>
        </div>
<div class="brand-container">
            <div class="divider"></div>
            <div class="brand-name">TABLE AI 泰博乐</div>
            <div class="tagline">以智炼智，赋能未来 | tableai.ai</div>
        </div>
        <div class="logo-watermark"><img src="/home/ubuntu/table_ai_presentation/a2a_logo_white.png" alt="Logo"></div>
    </div>
</body>
</html>
