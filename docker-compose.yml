services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tablecontent
      POSTGRES_PASSWORD: tablecontent
      POSTGRES_DB: tablecontent
    volumes:
      - tablecontent_pg:/var/lib/postgresql/data

volumes:
  tablecontent_pg:
